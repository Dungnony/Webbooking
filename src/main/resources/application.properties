spring.application.name=backendcuoiky
server.port=${PORT:8080}

# Doc mat khau / secret tu file .env o thu muc goc (neu co).
# Tren Railway/CI khong co file .env -> lay tu bien moi truong.
spring.config.import=optional:file:.env[.properties]

# Database - Session Pooler (5432), khong dung Transaction Pooler (6543) vi Hibernate can session lau dai
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.madpcgneaunzuwvkugtu}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Supabase Storage - luu anh upload (khong co SUPABASE_KEY -> luu vao thu muc uploads/ tren may)
supabase.url=${SUPABASE_URL:https://madpcgneaunzuwvkugtu.supabase.co}
supabase.key=${SUPABASE_KEY:}
supabase.bucket=${SUPABASE_BUCKET:images}

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Payment QR - TPBank via VietQR
payment.bank.name=TPBank
payment.bank.account-number=10001473192
payment.bank.account-name=NGUYEN DUY TU
payment.qr.template=compact2

payment.sepay.api-key=${SEPAY_API_KEY:}

# JWT - khoa ky token dang nhap (it nhat 32 ky tu)
jwt.secret=${JWT_SECRET:}

# Google OAuth2 Login
google.client-id=${GOOGLE_CLIENT_ID:629111799618-99e15l0prujq2bqif30mtfr6eevlqk7s.apps.googleusercontent.com}